<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#C8A96A"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <circle cx="300" cy="300" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <!-- Luxury Ring Shape -->
  <ellipse cx="300" cy="360" rx="140" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="18" filter="url(#glow)"/>
  <!-- Diamond Mount -->
  <polygon points="300,160 250,220 350,220" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <polygon points="300,160 230,220 370,220" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <polygon points="270,220 300,290 330,220" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Diamond Gem Cut -->
  <polygon points="300,120 340,160 260,160" fill="#E6F2FF" opacity="0.9"/>
  <polygon points="300,120 360,160 340,160" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="300,120 240,160 260,160" fill="#B3D7FF" opacity="0.8"/>
  <polygon points="300,220 260,160 340,160" fill="#FFFFFF" opacity="0.7"/>
  <!-- Sparkles -->
  <path d="M 220,130 L 225,145 L 240,150 L 225,155 L 220,170 L 215,155 L 200,150 L 215,145 Z" fill="url(#goldGrad)"/>
  <path d="M 380,110 L 383,120 L 393,123 L 383,126 L 380,136 L 377,126 L 367,123 L 377,120 Z" fill="#FFFFFF"/>
  <!-- Text Label -->
  <text x="300" y="520" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" fill="url(#goldGrad)" letter-spacing="4">GEMGLITZ LUXURY</text>
</svg>
